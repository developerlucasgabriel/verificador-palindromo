<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio Palindromo</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container">
        <main>
            <div class="form-section">
                <form>
                    <div class="form-header">
                        <h2 class="form-title">Descubra se a palavra é um <span id="destaque">Palindromo</span> 🔁</h2>
                    </div>
                    <div id="form-image">
                        <p>Leia esta frase de trás para frente, por exemplo:</p>
                        <img src="assets/images/lobo-img.png" alt="imagem-formulario">
                    </div>
                    <div class="input-group">
                        <div class="input-box">
                            <input required type="text" name="palavra" id="palavra" placeholder="Escreva algo…" maxlength="70">
                            <div class="form-button">
                                <button id="btn-verificar" type="submit">Verificar</button>
                            </div>
                            <div id="result-group">
                                <div id="div-result">
                                    <p id="result">Resultado</p>
                                </div>
                                <div id="div-details">
                                    <p id="details">Detalhes: </p>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </main>
    </div>
    <footer>
        <p>🖖 Desenvolvido por Lucas Gabriel Costa Coutinho.</p>
    </footer>
    <script src="renderer.js"></script>
</body>

</html>
