<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de Palindromo</title>
    <link rel="stylesheet" href="src/css/style.css">
    <link rel="shortcut icon" href="src/assets/icons/favicon.png" type="image/x-icon">
</head>

<body>
    <main>
    <div class="container">
            <div class="form-section">
                <form action="">
                    <div class="form-header">
                        <h2 class="form-title">Descubra se a palavra é um <span id="destaque">Palindromo</span> 🔁</h2>
                    </div>
                    <div id="form-image">
                        <p>Leia esta frase de trás para frente, por exemplo:</p>
                        <img src="src/assets/images/img-comprimida.png" alt="Exemplo visual de frase que pode ser lida de trás para frente">
                    </div>
                    <div class="input-group">
                        <div class="input-box">
                            <label for="palavra"></label>
                            <input required type="text" name="palavra" id="palavra" placeholder="Escreva algo…" maxlength="70">
                        </div>
                    </div>
                    <div class="form-button">
                        <button id="btn-verificar" type="submit">Verificar</button>
                    </div>
                    <div id="result-group">
                        <div id="div-result">
                            <p id="result">Resultado</p>
                        </div>
                        <div id="div-details">
                            <p id="details">Detalhes: </p>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </main>
    <footer>
        <p>🖖 Desenvolvido por <span>Lucas Gabriel Costa Coutinho.</span></p>
    </footer>
    <script src="src/renderer.js"></script>
</body>

</html>
